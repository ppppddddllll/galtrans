[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galtrans"
version = "0.1.0"
description = "「大图书馆」一键汉化工具：离线脚本汉化 + 实时 OCR 翻译（Galgame）"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = ["galgame", "translation", "hanhua", "renpy", "kirikiri", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "Pillow>=10.0",
    "winrt-Windows.Media.Ocr",
    "winrt-Windows.Graphics.Imaging",
    "winrt-Windows.Globalization",
    "winrt-Windows.Storage.Streams",
    "winrt-Windows.Storage",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
]

[project.gui-scripts]
galtrans = "galtrans.main:main"

[project.urls]
Homepage = "https://github.com/ppppddddllll/galtrans"
Repository = "https://github.com/ppppddddllll/galtrans"
Issues = "https://github.com/ppppddddllll/galtrans/issues"

[tool.setuptools.packages.find]
include = ["galtrans*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
